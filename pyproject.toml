[project]
name = "pink-elephant"
version = "0.1.0"
description = "AlphaGo-style chess experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2",
    "modal>=1.0.0",
    "numpy>=2.2.0",
    "pyarrow>=19.0.0",
    "torch>=2.7.0",
    "tqdm>=4.70.0",
]

[project.scripts]
pink-elephant = "pink_elephant.cli:main"
play-stockfish = "pink_elephant.arena_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--cov=pink_elephant", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pink_elephant"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
